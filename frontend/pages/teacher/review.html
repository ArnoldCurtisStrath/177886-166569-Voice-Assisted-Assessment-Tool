<!-- VoiceAssess — Teacher Pending Reviews -->
<div class="animate-fade-in">
  <div class="section-header">
    <span class="section-title">Pending Reviews</span>
    <span class="badge badge-warning" id="review-count">0</span>
  </div>

  <div class="tabs" style="margin-bottom: var(--space-4);">
    <button class="tab tab-active" data-review-filter="pending">Pending</button>
    <button class="tab" data-review-filter="flagged">Flagged</button>
    <button class="tab" data-review-filter="reviewed">Reviewed</button>
  </div>

  <div class="list-stack" id="review-list" style="gap: var(--space-4);"></div>

  <div class="empty-state" id="review-empty" style="display: none;">
    <div class="empty-state-icon">~</div>
    <h4>All caught up</h4>
    <p>No pending reviews to process.</p>
  </div>
</div>

<script>
  (function() {
    var reviews = [];
    var activeFilter = 'pending';
    var busy = false;

    // load from API
    function loadReviews() {
      API.get('/api/teacher/reviews')
        .then(function(data) {
          reviews = data;
          renderReviews();
        })
        .catch(function(err) {
          console.error('Failed to load reviews:', err);
          showToast('Could not load reviews.', 'error');
        });
    }

    function renderReviews() {
      var filtered;
      if (activeFilter === 'pending') {
        filtered = reviews.filter(function(r) { return r.status === 'PENDING_REVIEW' || r.status === 'EDITED'; });
      } else if (activeFilter === 'flagged') {
        filtered = reviews.filter(function(r) { return r.lowConfidenceCount > 0 && (r.status === 'PENDING_REVIEW' || r.status === 'EDITED'); });
      } else {
        // reviewed tab
        filtered = reviews.filter(function(r) { return r.status === 'APPROVED' || r.status === 'REJECTED'; });
      }

      var listEl = document.getElementById('review-list');
      var emptyEl = document.getElementById('review-empty');
      var countEl = document.getElementById('review-count');
      if (countEl) countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        if (listEl) listEl.innerHTML = '';
        if (emptyEl) emptyEl.style.display = '';
        return;
      }
      if (emptyEl) emptyEl.style.display = 'none';

      if (listEl) {
        listEl.innerHTML = filtered.map(function(r) {
          var hasLowConf = r.lowConfidenceCount > 0;
          var confBadge = hasLowConf
            ? '<span class="badge" style="background:#FDEDEC;color:var(--color-error);margin-left:var(--space-2);">' + escapeHtml(r.lowConfidenceCount) + ' low confidence</span>'
            : '';

          var statusBadge = '';
          if (r.status === 'EDITED') {
            statusBadge = '<span class="badge badge-warning" style="margin-left:var(--space-2);">Edited</span>';
          } else if (r.status === 'APPROVED') {
            statusBadge = '<span class="badge" style="background:#E8F8EF;color:var(--color-success);margin-left:var(--space-2);">Approved</span>';
          } else if (r.status === 'REJECTED') {
            statusBadge = '<span class="badge" style="background:#FDEDEC;color:var(--color-error);margin-left:var(--space-2);">Rejected</span>';
          }

          var isReviewed = r.status === 'APPROVED' || r.status === 'REJECTED';

          return '<div class="card review-card" data-staging-id="' + escapeHtml(r.stagingId) + '" data-audio-id="' + escapeHtml(r.audioId) + '" style="cursor:pointer;">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-2);">' +
              '<div>' +
                '<div style="font-weight:600;">' + escapeHtml(r.className) + ' &middot; ' + escapeHtml(r.subjectName) + statusBadge + '</div>' +
                '<div class="text-sm text-muted">' + escapeHtml(r.topic) + ' &middot; ' + fmtDate(r.date) + '</div>' +
              '</div>' +
              '<span class="text-sm text-muted">' + escapeHtml(r.studentCount) + ' students</span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:var(--space-2);">' +
              '<span class="text-xs text-muted" style="flex:1;">' + (escapeHtml(r.transcriptSnippet || 'No transcript')) + '</span>' +
              confBadge +
            '</div>' +
            (isReviewed ? '' :
            '<div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);">' +
              '<button class="btn btn-sm review-approve" data-staging-id="' + escapeHtml(r.stagingId) + '" style="flex:1;background:#E8F8EF;color:var(--color-success);border:1.5px solid var(--color-success);border-radius:var(--radius-sm);">Approve</button>' +
              '<button class="btn btn-sm review-edit-btn" data-staging-id="' + escapeHtml(r.stagingId) + '" style="flex:1;background:transparent;color:var(--color-primary);border:1.5px solid var(--color-primary);border-radius:var(--radius-sm);">Edit</button>' +
              '<button class="btn btn-sm review-reject" data-staging-id="' + escapeHtml(r.stagingId) + '" style="flex:1;background:#FDEDEC;color:var(--color-error);border:1.5px solid var(--color-error);border-radius:var(--radius-sm);">Reject</button>' +
            '</div>') +
          '</div>';
        }).join('');

        // wire click on card to show detail
        document.querySelectorAll('.review-card').forEach(function(card) {
          card.addEventListener('click', function(e) {
            // don't trigger if clicking a button
            if (e.target.tagName === 'BUTTON') return;
            var sid = card.getAttribute('data-staging-id');
            showDetail(sid);
          });
        });

        wireActions();
      }
    }

    function showDetail(stagingId) {
      API.get('/api/teacher/reviews/' + stagingId)
        .then(function(data) {
          var bodyHtml = '<div style="max-height:60vh;overflow-y:auto;">';

          // session info
          bodyHtml += '<div class="text-sm" style="margin-bottom:var(--space-3);">';
          bodyHtml += '<strong>' + escapeHtml(data.subjectName) + '</strong> &middot; ' + escapeHtml(data.topic) + '<br>';
            bodyHtml += 'Class: ' + escapeHtml(data.className) + ' &middot; ' + fmtDate(data.date) + '<br>';
          bodyHtml += 'Strand: ' + (escapeHtml(data.strand || '-')) + ' &middot; ' + (escapeHtml(data.subStrand || '-')) + '<br>';
          bodyHtml += '</div>';

          // rubric
          if (data.rubricDesc) {
            bodyHtml += '<div class="text-xs text-muted" style="margin-bottom:var(--space-2);background:var(--color-bg);padding:var(--space-2);border-radius:var(--radius-sm);">';
            bodyHtml += '<strong>Rubric:</strong> ' + escapeHtml(data.rubricDesc) + '<br>';
            bodyHtml += '<strong>Scale:</strong> ' + (escapeHtml(data.ratingScale || ''));
            bodyHtml += '</div>';
          }

          // transcript
          if (data.fullTranscript) {
            bodyHtml += '<details style="margin-bottom:var(--space-3);"><summary class="text-sm" style="cursor:pointer;font-weight:600;">Transcript</summary>';
            bodyHtml += '<div class="text-xs" style="background:var(--color-bg);padding:var(--space-2);max-height:200px;overflow-y:auto;white-space:pre-wrap;border-radius:var(--radius-sm);margin-top:var(--space-1);">' + (escapeHtml(data.fullTranscript || data.transcriptSnippet || '')) + '</div>';
            bodyHtml += '</details>';
          }

          // per-student assessments
          var items = data.assessment;
          if (items && items.length > 0) {
            bodyHtml += '<div style="margin-bottom:var(--space-2);font-weight:600;font-size:0.9rem;">Student Assessments</div>';
            for (var i = 0; i < items.length; i++) {
              var a = items[i];
              var flagColor = a.confidenceFlag === 'red' ? 'var(--color-error)' : a.confidenceFlag === 'orange' ? 'var(--color-warning)' : 'var(--color-success)';
              bodyHtml += '<div class="card" style="margin-bottom:var(--space-2);border-left:3px solid ' + flagColor + ';">';
              bodyHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-1);">';
              bodyHtml += '<span style="font-weight:600;">' + (escapeHtml(a.studentName || 'Unknown')) + '</span>';
              bodyHtml += '<span class="badge" style="font-size:0.7rem;">' + escapeHtml(a.ratingLevel) + '</span>';
              bodyHtml += '</div>';
              bodyHtml += '<div class="text-xs text-muted">Confidence: <span style="color:' + flagColor + ';font-weight:600;">' + (escapeHtml(a.confidence || 'medium')) + '</span></div>';
              if (a.evidence) {
                bodyHtml += '<div class="text-xs" style="margin-top:var(--space-1);font-style:italic;">"' + escapeHtml(a.evidence) + '"</div>';
              }
              if (a.strengths) {
                bodyHtml += '<div class="text-xs" style="margin-top:var(--space-1);color:var(--color-success);">+ ' + escapeHtml(a.strengths) + '</div>';
              }
              if (a.areasForImprovement) {
                bodyHtml += '<div class="text-xs" style="margin-top:2px;color:var(--color-warning);">- ' + escapeHtml(a.areasForImprovement) + '</div>';
              }
              bodyHtml += '</div>';
            }
          }

          if (data.overallSummary) {
            bodyHtml += '<div class="text-xs text-muted" style="margin-top:var(--space-2);border-top:1px solid var(--color-border);padding-top:var(--space-2);">' + escapeHtml(data.overallSummary) + '</div>';
          }

          // existing records from DB (auto-created during AI parse)
          var existingRecs = data.existingRecords;
          if (existingRecs && existingRecs.length > 0) {
            var recsLabel = (data.status === 'APPROVED' || data.status === 'REJECTED') ? 'Finalized Records' : 'Auto-generated Records';
            bodyHtml += '<div style="margin-top:var(--space-3);">';
            bodyHtml += '<div style="font-weight:600;font-size:0.9rem;margin-bottom:var(--space-2);">' + recsLabel + '</div>';
            for (var ei = 0; ei < existingRecs.length; ei++) {
              var er = existingRecs[ei];
              bodyHtml += '<div class="card" style="margin-bottom:var(--space-1);">';
              bodyHtml += '<div style="display:flex;justify-content:space-between;align-items:center;">';
              bodyHtml += '<span style="font-weight:600;">' + (escapeHtml(er.studentName || 'Unknown')) + '</span>';
              bodyHtml += '<span style="font-weight:700;">' + (er.score != null ? er.score.toFixed(1) : '-') + '</span>';
              bodyHtml += '</div>';
              bodyHtml += '<div class="text-xs text-muted">' + (escapeHtml(er.ratingLevel || '-')) + ' &middot; confidence: ' + (escapeHtml(er.confidence || '-')) + '</div>';
              bodyHtml += '</div>';
            }
            bodyHtml += '</div>';
          }

          // raw AI JSON (if parsing failed, or for transparency)
          if (data.rawPayload) {
            bodyHtml += '<details style="margin-top:var(--space-2);"><summary class="text-xs" style="cursor:pointer;color:var(--color-muted);">Raw AI JSON (parse error)</summary>';
            bodyHtml += '<pre class="text-xs" style="background:var(--color-bg);padding:var(--space-2);max-height:200px;overflow:auto;white-space:pre-wrap;border-radius:var(--radius-sm);margin-top:var(--space-1);">' + escapeHtml(data.rawPayload) + '</pre>';
            bodyHtml += '</details>';
          }

          // container for audit records (populated async for reviewed items)
          bodyHtml += '<div id="audit-records-container" style="margin-top:var(--space-3);"></div>';

          bodyHtml += '</div>';

          var isPending = data.status === 'PENDING_REVIEW' || data.status === 'EDITED';
          var footer = isPending
            ? '<button class="btn btn-ghost btn-sm modal-close-btn">Close</button>' +
              '<button class="btn btn-sm modal-approve-btn" style="background:#E8F8EF;color:var(--color-success);border:1.5px solid var(--color-success);" data-sid="' + stagingId + '">Approve</button>' +
              '<button class="btn btn-sm modal-edit-btn" style="background:transparent;color:var(--color-primary);border:1.5px solid var(--color-primary);" data-sid="' + stagingId + '">Edit</button>' +
              '<button class="btn btn-sm modal-reject-btn" style="background:#FDEDEC;color:var(--color-error);border:1.5px solid var(--color-error);" data-sid="' + stagingId + '">Reject</button>'
            : '<button class="btn btn-ghost btn-sm modal-close-btn">Close</button>';

          showModal(escapeHtml(data.subjectName) + ' \u00B7 ' + escapeHtml(data.topic), bodyHtml, footer);

          // for reviewed items, load full audit with version history
          if (!isPending && data.audioId) {
            loadAuditRecords(data.audioId);
          }

          // wire detail modal buttons — showModal appends synchronously, no timer needed
          document.querySelectorAll('.modal-close-btn').forEach(function(b) {
            b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
          });
          var appBtn = document.querySelector('.modal-approve-btn');
          if (appBtn) appBtn.addEventListener('click', function() { doApprove(stagingId); });
          var edtBtn = document.querySelector('.modal-edit-btn');
          if (edtBtn) edtBtn.addEventListener('click', function() { showEditForm(stagingId, data); });
          var rejBtn = document.querySelector('.modal-reject-btn');
          if (rejBtn) rejBtn.addEventListener('click', function() { doReject(stagingId); });
        })
        .catch(function(err) {
          showToast('Failed to load review detail.', 'error');
        });
    }

    function loadAuditRecords(audioId) {
      API.get('/api/teacher/assessments/' + audioId + '/audit')
        .then(function(audit) {
          var records = audit.records || [];
          var container = document.getElementById('audit-records-container');
          if (!container) return;

          if (records.length === 0) {
            container.innerHTML = '<div class="text-xs text-muted">No finalized records found.</div>';
            return;
          }

          var html = '<div style="font-weight:600;font-size:0.9rem;margin-bottom:var(--space-2);">Records &amp; Version History</div>';
          for (var i = 0; i < records.length; i++) {
            var r = records[i];
            html += '<div class="card" style="margin-bottom:var(--space-2);">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-1);">';
            html += '<span style="font-weight:600;">' + escapeHtml(r.studentName) + '</span>';
            html += '<span style="font-size:1.1rem;font-weight:700;">' + (r.score != null ? r.score.toFixed(1) : '-') + '</span>';
            html += '</div>';
            html += '<div class="text-xs text-muted">' + (escapeHtml(r.ratingLevel || '-')) + ' &middot; ' + (escapeHtml(r.confidence || '-')) + '</div>';
            if (r.evidence) {
              html += '<div class="text-xs" style="font-style:italic;margin-top:var(--space-1);">"' + escapeHtml(r.evidence) + '"</div>';
            }
            if (r.feedback) {
              html += '<div class="text-xs" style="margin-top:var(--space-1);white-space:pre-wrap;">' + escapeHtml(r.feedback) + '</div>';
            }
            // version history from audit endpoint
            if (r.versions && r.versions.length > 0) {
              html += '<details style="margin-top:var(--space-2);"><summary class="text-xs" style="cursor:pointer;">Version History (' + r.versions.length + ')</summary>';
              for (var j = 0; j < r.versions.length; j++) {
                var v = r.versions[j];
                html += '<div class="text-xs" style="margin-top:var(--space-1);padding:var(--space-1);background:var(--color-bg);border-radius:var(--radius-sm);">';
                html += 'v' + escapeHtml(v.versionNumber) + (v.isOriginal ? ' (original)' : ' (edited)') + ' by ' + (escapeHtml(v.editedBy || '')) + ' &mdash; ' + fmtDate(v.editTimestamp);
                html += '</div>';
              }
              html += '</details>';
            }
            html += '</div>';
          }

          container.innerHTML = html;
        })
        .catch(function() {
          var container = document.getElementById('audit-records-container');
          if (container) container.innerHTML = '<div class="text-xs text-muted">Could not load records.</div>';
        });
    }

    function showEditForm(stagingId, data) {
      var items = data.assessment || [];
      var formHtml = '<div style="max-height:55vh;overflow-y:auto;">';
      for (var i = 0; i < items.length; i++) {
        var a = items[i];
        var missingId = !a.studentId ? ' <span class="text-xs" style="color:var(--color-error);">(no record — skipped on save)</span>' : '';
        formHtml += '<div class="card" style="margin-bottom:var(--space-2);">';
        formHtml += '<div style="font-weight:600;margin-bottom:var(--space-2);">' + (escapeHtml(a.studentName) || 'Student ' + (i + 1)) + missingId + '</div>';
        formHtml += '<div class="form-group"><label>Rating Level</label><select class="input edit-rating" data-idx="' + i + '">';
        var ratings = ['Below Expectations', 'Approaching Expectations', 'Meeting Expectations', 'Exceeding Expectations'];
        for (var j = 0; j < ratings.length; j++) {
          formHtml += '<option value="' + ratings[j] + '"' + (a.ratingLevel === ratings[j] ? ' selected' : '') + '>' + ratings[j] + '</option>';
        }
        formHtml += '</select></div>';
        formHtml += '<div class="form-group"><label>Strengths</label><textarea class="input edit-strengths" rows="2" data-idx="' + i + '">' + (escapeHtml(a.strengths || '')) + '</textarea></div>';
        formHtml += '<div class="form-group"><label>Areas to Improve</label><textarea class="input edit-areas" rows="2" data-idx="' + i + '">' + (escapeHtml(a.areasForImprovement || '')) + '</textarea></div>';
        formHtml += '</div>';
      }
      formHtml += '</div>';

      showModal('Edit Assessment', formHtml,
        '<button class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>' +
        '<button class="btn btn-primary btn-sm" id="save-edit-btn">Save Changes</button>');

      document.querySelectorAll('.modal-close-btn').forEach(function(b) {
        b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
      });
      var saveBtn = document.getElementById('save-edit-btn');
      saveBtn.addEventListener('click', function() {
        if (saveBtn.disabled) return;
        saveBtn.disabled = true;

        // rows are keyed by index — the old studentId-keyed lookup broke when
        // the AI payload omitted ids (empty selector matched every row)
        var edited = [];
        var skipped = 0;
        for (var i = 0; i < items.length; i++) {
          var ratingEl = document.querySelector('.edit-rating[data-idx="' + i + '"]');
          var strengthsEl = document.querySelector('.edit-strengths[data-idx="' + i + '"]');
          var areasEl = document.querySelector('.edit-areas[data-idx="' + i + '"]');
          var orig = items[i];
          if (!orig.studentId) { skipped++; continue; }
          edited.push({
            studentId: orig.studentId,
            studentName: orig.studentName || '',
            ratingLevel: ratingEl ? ratingEl.value : (orig.ratingLevel || 'Meeting Expectations'),
            confidence: orig.confidence || 'medium',
            evidence: orig.evidence || '',
            strengths: strengthsEl ? strengthsEl.value : '',
            areasForImprovement: areasEl ? areasEl.value : ''
          });
        }
        if (skipped > 0) showToast(skipped + ' student(s) without a record were left unchanged.', 'warning');
        doEdit(stagingId, edited);
      });
    }

    function doApprove(stagingId) {
      // approving finalizes the records — confirm first so a stray tap can't do it
      showModal('Approve Assessment',
        '<p class="text-sm">This will finalize the assessment and make it visible to students and parents.</p>',
        '<button class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>' +
        '<button class="btn btn-sm" id="confirm-approve-btn" style="background:#E8F8EF;color:var(--color-success);border:1.5px solid var(--color-success);">Approve</button>');

      document.querySelectorAll('.modal-close-btn').forEach(function(b) {
        b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
      });
      var btn = document.getElementById('confirm-approve-btn');
      btn.addEventListener('click', function() {
        if (busy || btn.disabled) return;
        busy = true;
        btn.disabled = true;
        API.post('/api/teacher/reviews/' + stagingId + '/approve')
          .then(function() {
            busy = false;
            var o = document.querySelector('.modal-overlay'); if (o) o.remove();
            showToast('Assessment approved and finalized.', 'success');
            loadReviews();
          })
          .catch(function(err) {
            busy = false;
            btn.disabled = false;
            showToast('Approve failed: ' + (err.message || 'Unknown error'), 'error');
          });
      });
    }

    function doEdit(stagingId, edited) {
      if (busy) return;
      busy = true;
      var o = document.querySelector('.modal-overlay'); if (o) o.remove();
      API.post('/api/teacher/reviews/' + stagingId + '/edit', { assessment: edited })
        .then(function() {
          showToast('Assessment edited and finalized.', 'success');
          loadReviews();
        })
        .catch(function(err) {
          showToast('Edit failed: ' + (err.message || 'Unknown error'), 'error');
        })
        .finally(function() { busy = false; });
    }

    function doReject(stagingId) {
      showModal('Reject Assessment',
        '<p class="text-sm">This assessment will be discarded. This cannot be undone.</p>',
        '<button class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>' +
        '<button class="btn btn-danger btn-sm" id="confirm-reject-btn">Reject</button>');
      document.querySelectorAll('.modal-close-btn').forEach(function(b) {
        b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
      });
      var btn = document.getElementById('confirm-reject-btn');
      btn.addEventListener('click', function() {
        if (busy || btn.disabled) return;
        busy = true;
        btn.disabled = true;
        API.post('/api/teacher/reviews/' + stagingId + '/reject')
          .then(function() {
            busy = false;
            var o = document.querySelector('.modal-overlay'); if (o) o.remove();
            showToast('Assessment rejected.', 'error');
            loadReviews();
          })
          .catch(function(err) {
            busy = false;
            btn.disabled = false;
            showToast('Reject failed: ' + (err.message || 'Unknown error'), 'error');
          });
      });
    }

    function wireActions() {
      document.querySelectorAll('.review-approve').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          doApprove(btn.getAttribute('data-staging-id'));
        });
      });
      document.querySelectorAll('.review-edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var sid = btn.getAttribute('data-staging-id');
          API.get('/api/teacher/reviews/' + sid)
            .then(function(data) { showEditForm(sid, data); })
            .catch(function() { showToast('Failed to load detail.', 'error'); });
        });
      });
      document.querySelectorAll('.review-reject').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          doReject(btn.getAttribute('data-staging-id'));
        });
      });
    }

    // tab filters
    document.querySelectorAll('[data-review-filter]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('[data-review-filter]').forEach(function(t) { t.classList.remove('tab-active'); });
        tab.classList.add('tab-active');
        activeFilter = tab.getAttribute('data-review-filter');
        renderReviews();
      });
    });

    loadReviews();
  })();
</script>
