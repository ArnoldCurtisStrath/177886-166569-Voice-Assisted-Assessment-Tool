<!-- VoiceAssess — Teacher Assessment Audit View -->
<div class="animate-fade-in">
  <div class="section-header">
    <span class="section-title" id="audit-title">Assessment Audit</span>
    <a class="btn btn-sm btn-secondary" href="#teacher/class">Back to Grid</a>
  </div>

  <div id="audit-loading" class="text-sm text-muted" style="padding:var(--space-6);text-align:center;">Loading...</div>

  <div id="audit-content" class="hidden">
    <!-- metadata -->
    <div class="card" id="audit-meta" style="margin-bottom:var(--space-4);"></div>

    <!-- tabs for transcript / AI / records -->
    <div class="tabs" style="margin-bottom:var(--space-3);">
      <button class="tab tab-active" data-audit-tab="transcript">Transcript</button>
      <button class="tab" data-audit-tab="ai">AI Assessment</button>
      <button class="tab" data-audit-tab="records">Records</button>
    </div>

    <div id="audit-tab-content"></div>
  </div>

  <div class="empty-state" id="audit-empty" style="display:none;">
    <div class="empty-state-icon">!</div>
    <h4>Assessment not found</h4>
    <p>This assessment may have been deleted or the ID is invalid.</p>
  </div>
</div>

<script>
  (function() {
    var audioId = localStorage.getItem('voiceassess_audit_audio');
    if (!audioId) {
      document.getElementById('audit-loading').textContent = 'No assessment selected.';
      return;
    }

    var auditData = null;

    API.get('/api/teacher/assessments/' + audioId + '/audit')
      .then(function(data) {
        auditData = data;
        document.getElementById('audit-loading').style.display = 'none';
        document.getElementById('audit-content').classList.remove('hidden');
        document.getElementById('audit-title').textContent = data.subjectName + ' — ' + (data.topic || 'Assessment');
        renderMeta(data);
        renderTranscriptTab(data);
      })
      .catch(function(err) {
        document.getElementById('audit-loading').textContent = 'Failed: ' + (err.message || 'Unknown error');
      });

    function renderMeta(data) {
      var el = document.getElementById('audit-meta');
      el.innerHTML =
        '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);">' +
          '<div><span class="text-xs text-muted">Subject</span><br><strong>' + (data.subjectName || '-') + '</strong></div>' +
          '<div><span class="text-xs text-muted">Topic</span><br><strong>' + (data.topic || '-') + '</strong></div>' +
          '<div><span class="text-xs text-muted">Class</span><br><strong>' + (data.className || '-') + '</strong></div>' +
          '<div><span class="text-xs text-muted">Date</span><br><strong>' + (data.date || '-') + '</strong></div>' +
          '<div><span class="text-xs text-muted">Status</span><br><span class="badge">' + (data.status || '-') + '</span></div>' +
        '</div>';
    }

    function renderTranscriptTab(data) {
      var html = '';
      if (data.rubricDesc) {
        html += '<div class="card" style="margin-bottom:var(--space-3);">';
        html += '<div class="text-sm" style="font-weight:600;margin-bottom:var(--space-1);">Rubric Reference</div>';
        html += '<div class="text-xs">' + data.rubricDesc + '</div>';
        html += '<div class="text-xs text-muted" style="margin-top:var(--space-1);">Scale: ' + (data.ratingScale || '') + '</div>';
        html += '</div>';
      }

      if (data.fullTranscript) {
        html += '<div class="card">';
        html += '<div class="text-sm" style="font-weight:600;margin-bottom:var(--space-2);">Full Transcript</div>';
        html += '<div style="white-space:pre-wrap;font-size:0.8rem;line-height:1.6;max-height:500px;overflow-y:auto;">' + data.fullTranscript + '</div>';
        html += '</div>';
      } else if (data.transcriptSnippet) {
        html += '<div class="card"><div class="text-xs">' + data.transcriptSnippet + '</div></div>';
      } else {
        html += '<p class="text-sm text-muted">No transcript available.</p>';
      }

      document.getElementById('audit-tab-content').innerHTML = html;
    }

    function renderAiTab(data) {
      var ai = data.aiAssessment;
      var html = '';

      if (!ai) {
        html = '<p class="text-sm text-muted">No AI assessment data available.</p>';
        document.getElementById('audit-tab-content').innerHTML = html;
        return;
      }

      var items = ai.assessment;
      if (items && items.length > 0) {
        for (var i = 0; i < items.length; i++) {
          var a = items[i];
          html += '<div class="card" style="margin-bottom:var(--space-2);">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-1);">';
          html += '<span style="font-weight:600;">' + (a.studentName || 'Unknown') + '</span>';
          html += '<span class="badge">' + a.ratingLevel + '</span>';
          html += '</div>';
          html += '<div class="text-xs text-muted">Confidence: ' + (a.confidence || 'medium') + '</div>';
          if (a.evidence) html += '<div class="text-xs" style="margin-top:var(--space-1);font-style:italic;">"' + a.evidence + '"</div>';
          if (a.strengths) html += '<div class="text-xs" style="color:var(--color-success);">+ ' + a.strengths + '</div>';
          if (a.areasForImprovement) html += '<div class="text-xs" style="color:var(--color-warning);">- ' + a.areasForImprovement + '</div>';
          html += '</div>';
        }
      }

      if (ai.overallSummary) {
        html += '<div class="card"><div class="text-xs">' + ai.overallSummary + '</div></div>';
      }

      document.getElementById('audit-tab-content').innerHTML = html;
    }

    function renderRecordsTab(data) {
      var records = data.records || [];
      var html = '';

      if (records.length === 0) {
        html = '<p class="text-sm text-muted">No finalized records yet.</p>';
        document.getElementById('audit-tab-content').innerHTML = html;
        return;
      }

      for (var i = 0; i < records.length; i++) {
        var r = records[i];
        html += '<div class="card" style="margin-bottom:var(--space-2);">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-1);">';
        html += '<span style="font-weight:600;">' + r.studentName + '</span>';
        html += '<span style="font-size:1.1rem;font-weight:700;">' + r.score.toFixed(1) + '</span>';
        html += '</div>';
        html += '<div class="text-xs">Rating: ' + (r.ratingLevel || '-') + ' &middot; Confidence: ' + (r.confidence || '-') + '</div>';
        if (r.evidence) html += '<div class="text-xs" style="font-style:italic;margin-top:var(--space-1);">"' + r.evidence + '"</div>';
        if (r.feedback) html += '<div class="text-xs" style="margin-top:var(--space-1);white-space:pre-wrap;">' + r.feedback + '</div>';

        // version history
        if (r.versions && r.versions.length > 0) {
          html += '<details style="margin-top:var(--space-2);"><summary class="text-xs" style="cursor:pointer;">Version History (' + r.versions.length + ')</summary>';
          for (var j = 0; j < r.versions.length; j++) {
            var v = r.versions[j];
            html += '<div class="text-xs" style="margin-top:var(--space-1);padding:var(--space-1);background:var(--color-bg);border-radius:var(--radius-sm);">';
            html += 'v' + v.versionNumber + (v.isOriginal ? ' (original)' : ' (edited)') + ' by ' + (v.editedBy || '') + ' — ' + (v.editTimestamp || '');
            html += '</div>';
          }
          html += '</details>';
        }

        html += '</div>';
      }

      document.getElementById('audit-tab-content').innerHTML = html;
    }

    // tab switching
    document.querySelectorAll('[data-audit-tab]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('[data-audit-tab]').forEach(function(t) { t.classList.remove('tab-active'); });
        tab.classList.add('tab-active');
        var tabName = tab.getAttribute('data-audit-tab');
        if (!auditData) return;
        if (tabName === 'transcript') renderTranscriptTab(auditData);
        else if (tabName === 'ai') renderAiTab(auditData);
        else if (tabName === 'records') renderRecordsTab(auditData);
      });
    });
  })();
</script>
