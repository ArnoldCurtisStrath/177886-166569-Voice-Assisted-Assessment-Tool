<!-- VoiceAssess — Teacher Dashboard -->
<div class="animate-fade-in">
  <!-- Greeting -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);">
    <div>
      <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-1);" id="teacher-greeting">Hello, Teacher</h2>
      <p class="text-xs text-muted" style="margin-bottom: var(--space-5);" id="teacher-term">Term 1, 2026</p>
    </div>
    <button class="btn btn-ghost btn-sm" id="teacher-refresh" style="flex-shrink:0;">Refresh</button>
  </div>

  <!-- Stats Row -->
  <div class="stat-row" style="margin-bottom: var(--space-6);">
    <div class="stat-card">
      <div class="stat-value" id="stat-my-classes">-</div>
      <div class="stat-label">Classes</div>
    </div>
    <div class="stat-card" id="stat-pending-card" style="cursor:pointer;">
      <div class="stat-value" id="stat-pending">-</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card" id="stat-reviewed-card" style="cursor:pointer;">
      <div class="stat-value" id="stat-reviewed">-</div>
      <div class="stat-label">Reviewed</div>
    </div>
  </div>

  <!-- My Subjects -->
  <div class="section-header">
    <span class="section-title">My Subjects</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5);" id="teacher-subjects">
    <span class="text-xs text-muted">Loading...</span>
  </div>

  <!-- My Classes -->
  <div class="section-header">
    <span class="section-title">My Classes</span>
  </div>
  <div class="list-stack" style="margin-bottom: var(--space-6);" id="teacher-classes">
    <!-- Populated from API -->
  </div>
  <div class="empty-state" id="teacher-classes-empty" style="display:none;">
    <div class="empty-state-icon">[</div>
    <h4>No classes assigned</h4>
    <p>Ask your administrator to assign you to a class.</p>
  </div>

  <!-- Bottom Actions -->
  <div style="display: flex; gap: var(--space-3);">
    <a href="#teacher/curate" class="btn btn-primary" style="flex: 2;">+ New Assessment</a>
    <a href="#teacher/review" class="btn btn-secondary" style="flex: 1;">Reviews</a>
  </div>
</div>

<script>
  (function() {
    function loadDashboard() {
      // greeting from auth
      if (AuthStore.user) {
        var greet = document.getElementById('teacher-greeting');
        if (greet) greet.textContent = 'Hello, ' + AuthStore.user.fullName;
      }

    // load stats
    API.get('/api/teacher/stats')
      .then(function(s) {
        var sv = function(id, val) {
          var el = document.getElementById(id);
          if (el) el.textContent = val;
        };
        sv('stat-my-classes', s.totalClasses);
        sv('stat-pending', s.pendingReviews);
        sv('stat-reviewed', s.reviewedCount);

        // update active term
        if (s.activeTermName) {
          var termEl = document.getElementById('teacher-term');
          if (termEl) termEl.textContent = s.activeTermName;
        }
      })
      .catch(function() { showToast('Could not load stats.', 'error'); });

    // load subjects
    API.get('/api/teacher/subjects')
      .then(function(subjects) {
        var el = document.getElementById('teacher-subjects');
        if (!el) return;
        if (!subjects || subjects.length === 0) {
          el.innerHTML = '<span class="text-xs text-muted">No subjects assigned</span>';
          return;
        }
        el.innerHTML = subjects.map(function(s) {
          return '<span class="badge badge-primary" style="font-size:var(--text-xs);">' +
            escapeHtml(s.subjectName) + ' (G' + escapeHtml(s.gradeLevel) + ')</span>';
        }).join('');
      })
      .catch(function() {
        var el = document.getElementById('teacher-subjects');
        if (el) el.innerHTML = '<span class="text-xs text-muted">Could not load subjects</span>';
      });

    // load classes
    API.get('/api/teacher/classes')
      .then(function(classes) {
        var listEl = document.getElementById('teacher-classes');
        var emptyEl = document.getElementById('teacher-classes-empty');
        if (!classes || classes.length === 0) {
          if (listEl) listEl.innerHTML = '';
          if (emptyEl) emptyEl.style.display = '';
          return;
        }
        if (emptyEl) emptyEl.style.display = 'none';
        if (listEl) {
          listEl.innerHTML = classes.map(function(c) {
            return '<div class="list-item clickable" data-class-id="' + escapeHtml(c.classId) + '">' +
              '<div class="list-item-body">' +
                '<div class="list-item-title">' + escapeHtml(c.displayName) + '</div>' +
                '<div class="list-item-subtitle">Grade ' + escapeHtml(c.gradeLevel) + ' &middot; Stream: ' + escapeHtml(c.streamName) + '</div>' +
              '</div>' +
              '<div class="list-item-trailing">' +
                '<span class="list-chevron">&#x25B8;</span>' +
              '</div>' +
            '</div>';
          }).join('');

          // click handler — navigate to class grid
          listEl.querySelectorAll('.list-item').forEach(function(row) {
            row.addEventListener('click', function() {
              var cid = row.getAttribute('data-class-id');
              localStorage.setItem('voiceassess_selected_class', cid);
              Router.navigate('teacher/class');
            });
          });
        }
      })
      .catch(function() { showToast('Could not load classes.', 'error'); });
    }

    // navigate to review page when clicking pending stat
    var pendingCard = document.getElementById('stat-pending-card');
    if (pendingCard) {
      pendingCard.addEventListener('click', function() {
        Router.navigate('teacher/review');
      });
    }

    // navigate to review page (reviewed tab) when clicking reviewed stat
    var reviewedCard = document.getElementById('stat-reviewed-card');
    if (reviewedCard) {
      reviewedCard.addEventListener('click', function() {
        Router.navigate('teacher/review');
      });
    }

    // refresh button re-runs everything
    var refreshBtn = document.getElementById('teacher-refresh');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function() {
        showToast('Refreshing dashboard...', 'info');
        loadDashboard();
      });
    }

    loadDashboard();
  })();
</script>
