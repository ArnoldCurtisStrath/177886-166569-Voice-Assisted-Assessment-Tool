<!-- VoiceAssess — Login Page -->
<div style="display: flex; flex-direction: column; justify-content: center; min-height: 80dvh; max-width: 360px; margin: 0 auto; padding: var(--space-4);">
  <div style="text-align: center; margin-bottom: var(--space-8);">
    <h1 style="font-size: 1.75rem; color: var(--color-primary); margin-bottom: var(--space-1);">VoiceAssess</h1>
    <p class="text-sm text-secondary">Voice-Assisted CBC Assessment</p>
  </div>

  <!-- Login Form -->
  <form id="login-form" style="display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="form-group">
      <label for="login-email">Email address</label>
      <input type="email" id="login-email" class="input" placeholder="Enter your email" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>
      <div style="display:flex;gap:var(--space-2);">
        <input type="password" id="login-password" class="input" placeholder="Enter your password" autocomplete="current-password" required style="flex:1;">
        <button type="button" class="btn btn-ghost btn-sm" id="login-pw-toggle" style="flex-shrink:0;">Show</button>
      </div>
    </div>

    <div id="login-error" style="display: none; padding: var(--space-3); background: #FDEDEC; border: 1px solid var(--color-error); border-radius: var(--radius-sm); color: #8B1A1A; font-size: var(--text-sm);"></div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit">Log In</button>
  </form>

  <div style="display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-4);">
    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color); margin: 0;">
    <span class="text-xs text-muted" style="flex-shrink: 0; padding: 0 var(--space-1);">or</span>
    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color); margin: 0;">
  </div>

  <button type="button" class="btn btn-secondary btn-block" id="register-btn" style="margin-top: var(--space-3);">Register your school</button>

  <p style="text-align: center; margin-top: var(--space-4);">
    <span class="text-xs text-muted">Contact your school administrator for login credentials.</span>
  </p>
</div>

<script>
  // Login page logic
  (function() {
    var form = document.getElementById('login-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('login-email').value.trim();
        var password = document.getElementById('login-password').value;
        var errorEl = document.getElementById('login-error');
        var submitBtn = document.getElementById('login-submit');

        if (!email || !password) {
          errorEl.textContent = 'Please enter your email and password.';
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        errorEl.style.display = 'none';

        AuthStore.login(email, password)
          .then(function(user) {
            // if they were sent here from a deep link, take them back there
            var intended = sessionStorage.getItem('voiceassess_intended_route');
            sessionStorage.removeItem('voiceassess_intended_route');
            if (intended && intended.indexOf('#') === 0) {
              Router.navigate(intended.replace(/^#/, ''));
              return;
            }
            // otherwise go to the role dashboard
            var dashboard = user.role === 'ADMIN' ? '#admin' :
                           user.role === 'TEACHER' ? '#teacher' :
                           user.role === 'PARENT' ? '#parent' : '#student';
            Router.navigate(dashboard);
          })
          .catch(function(err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
          });
      });
    }

    // register button — use router for navigation
    var regBtn = document.getElementById('register-btn');
    if (regBtn) {
      regBtn.addEventListener('click', function() {
        Router.navigate('register');
      });
    }

    // password visibility toggle
    var pwToggle = document.getElementById('login-pw-toggle');
    var pwInput = document.getElementById('login-password');
    if (pwToggle && pwInput) {
      pwToggle.addEventListener('click', function() {
        var show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        pwToggle.textContent = show ? 'Hide' : 'Show';
      });
    }
  })();
</script>
