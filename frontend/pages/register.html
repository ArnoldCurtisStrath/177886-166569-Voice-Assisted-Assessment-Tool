<!-- VoiceAssess — School Registration -->
<div style="display: flex; flex-direction: column; justify-content: center; min-height: 80dvh; max-width: 360px; margin: 0 auto; padding: var(--space-4);">
  <div style="text-align: center; margin-bottom: var(--space-6);">
    <h1 style="font-size: 1.5rem; color: var(--color-primary); margin-bottom: var(--space-1);">Register Your School</h1>
    <p class="text-sm text-secondary">Set up VoiceAssess for your school</p>
  </div>

  <form id="register-form" style="display: flex; flex-direction: column; gap: var(--space-4);">
    <!-- School section -->
    <p style="font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">School Details</p>

    <div class="form-group">
      <label for="reg-school-name">School Name</label>
      <input type="text" id="reg-school-name" class="input" placeholder="e.g. Strathmore Primary School" required>
    </div>

    <div class="form-group">
      <label for="reg-knec-code">KNEC Code</label>
      <input type="text" id="reg-knec-code" class="input" placeholder="e.g. ST-001" required>
      <span class="text-xs text-muted" style="margin-top: 2px;">Your school's unique KNEC examination centre code</span>
    </div>

    <!-- Admin section -->
    <p style="font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); margin: 0; text-transform: uppercase; letter-spacing: 0.5px; margin-top: var(--space-2);">Administrator Account</p>

    <div class="form-group">
      <label for="reg-fullname">Your Full Name</label>
      <input type="text" id="reg-fullname" class="input" placeholder="Full name" required>
    </div>

    <div class="form-group">
      <label for="reg-email">Email Address</label>
      <input type="email" id="reg-email" class="input" placeholder="Enter your email" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="reg-password">Password</label>
      <div style="display:flex;gap:var(--space-2);">
        <input type="password" id="reg-password" class="input" placeholder="At least 6 characters" autocomplete="new-password" required style="flex:1;">
        <button type="button" class="btn btn-ghost btn-sm reg-pw-toggle" data-target="reg-password" style="flex-shrink:0;">Show</button>
      </div>
      <div id="reg-strength" style="display:none;margin-top:var(--space-2);">
        <div style="display:flex;gap:4px;">
          <div class="strength-bar" style="flex:1;height:4px;background:var(--border-color);border-radius:2px;"></div>
          <div class="strength-bar" style="flex:1;height:4px;background:var(--border-color);border-radius:2px;"></div>
          <div class="strength-bar" style="flex:1;height:4px;background:var(--border-color);border-radius:2px;"></div>
          <div class="strength-bar" style="flex:1;height:4px;background:var(--border-color);border-radius:2px;"></div>
        </div>
        <span class="text-xs text-muted" id="reg-strength-label" style="margin-top:2px;display:block;"></span>
      </div>
    </div>

    <div class="form-group">
      <label for="reg-confirm-password">Confirm Password</label>
      <div style="display:flex;gap:var(--space-2);">
        <input type="password" id="reg-confirm-password" class="input" placeholder="Re-enter your password" autocomplete="new-password" required style="flex:1;">
        <button type="button" class="btn btn-ghost btn-sm reg-pw-toggle" data-target="reg-confirm-password" style="flex-shrink:0;">Show</button>
      </div>
    </div>

    <div class="form-group">
      <label for="reg-phone">Phone Number (optional)</label>
      <input type="text" id="reg-phone" class="input" placeholder="+254...">
    </div>

    <div id="register-error" style="display: none; padding: var(--space-3); background: #FDEDEC; border: 1px solid var(--color-error); border-radius: var(--radius-sm); color: #8B1A1A; font-size: var(--text-sm);"></div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-submit">Register School</button>
  </form>

  <p style="text-align: center; margin-top: var(--space-4);">
    <button type="button" class="btn btn-ghost btn-sm" id="back-to-login">Already registered? Log in</button>
  </p>
</div>

<script>
  // Registration page logic
  (function() {
    var form = document.getElementById('register-form');
    if (!form) return;

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      var schoolName = document.getElementById('reg-school-name').value.trim();
      var knecCode = document.getElementById('reg-knec-code').value.trim();
      var fullName = document.getElementById('reg-fullname').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var password = document.getElementById('reg-password').value;
      var confirmPassword = document.getElementById('reg-confirm-password').value;
      var phone = document.getElementById('reg-phone').value.trim();
      var errorEl = document.getElementById('register-error');
      var submitBtn = document.getElementById('register-submit');

      if (!schoolName || !knecCode || !fullName || !email || !password || !confirmPassword) {
        errorEl.textContent = 'Please fill in all required fields.';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating your account...';
      errorEl.style.display = 'none';

      var payload = {
        schoolName: schoolName,
        knecCode: knecCode,
        fullName: fullName,
        email: email,
        password: password,
        confirmPassword: confirmPassword
      };
      if (phone) payload.contactPhone = phone;

      API.post('/api/auth/register', payload)
        .then(function(data) {
          var user = {
            id: data.userId,
            fullName: data.fullName,
            email: data.email,
            role: data.role,
            schoolId: data.schoolId || null
          };

          AuthStore.user = user;
          AuthStore.token = data.token;
          AuthStore.isLoggedIn = true;
          localStorage.setItem('voiceassess_auth', JSON.stringify({ user: user, token: data.token }));

          Router.navigate('admin');
        })
        .catch(function(err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register School';
        });
    });

    // back to login
    var backBtn = document.getElementById('back-to-login');
    if (backBtn) {
      backBtn.addEventListener('click', function() {
        Router.navigate('login');
      });
    }

    // password visibility toggles
    document.querySelectorAll('.reg-pw-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var input = document.getElementById(btn.getAttribute('data-target'));
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
      });
    });

    // strength meter — 4 bars, weak/fair/good/strong
    var pwInput = document.getElementById('reg-password');
    var strengthBox = document.getElementById('reg-strength');
    var strengthLabel = document.getElementById('reg-strength-label');
    var bars = strengthBox ? strengthBox.querySelectorAll('.strength-bar') : [];

    function scorePassword(pw) {
      var score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 10) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/\d/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++;
      return score;
    }

    if (pwInput && strengthBox) {
      pwInput.addEventListener('input', function() {
        var score = scorePassword(pwInput.value);
        var labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        var colors = ['', '#E74C3C', '#F39C12', '#2ECC71', '#1ABC9C'];
        strengthBox.style.display = pwInput.value ? '' : 'none';
        for (var i = 0; i < bars.length; i++) {
          bars[i].style.background = i < score ? colors[score] : '';
        }
        strengthLabel.textContent = score > 0 ? labels[score] + ' password' : '';
      });
    }
  })();
</script>
