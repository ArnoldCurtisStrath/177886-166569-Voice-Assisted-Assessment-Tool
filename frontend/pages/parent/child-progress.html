<!-- VoiceAssess — Parent Child Progress -->
<div class="animate-fade-in">
  <div class="section-header">
    <span class="section-title" id="progress-title">Student Progress</span>
  </div>

  <div id="progress-loading" class="text-sm text-muted" style="padding:var(--space-6);text-align:center;">Loading...</div>

  <div id="progress-content" class="hidden">
    <!-- overview stats -->
    <div class="stat-row" style="margin-bottom:var(--space-4);" id="progress-stats"></div>

    <!-- subject breakdown -->
    <div class="section-header">
      <span class="section-title">Subject Breakdown</span>
    </div>
    <div id="subject-breakdown" style="margin-bottom:var(--space-4);"></div>

    <!-- recent assessments -->
    <div class="section-header">
      <span class="section-title">Recent Assessments</span>
    </div>
    <div class="list-stack" id="recent-list" style="gap: var(--space-3);"></div>
  </div>

  <div class="empty-state" id="progress-empty" style="display:none;">
    <div class="empty-state-icon">~</div>
    <h4>No assessment data yet</h4>
    <p>Assessments will appear here once your child's teacher completes evaluations.</p>
  </div>
</div>

<script>
  (function() {
    var childId = localStorage.getItem('voiceassess_selected_child');
    if (!childId) {
      document.getElementById('progress-loading').textContent = 'No child selected.';
      return;
    }

    function getConfColor(conf) {
      if (!conf) return '#ccc';
      conf = conf.toLowerCase();
      if (conf === 'high') return 'var(--color-success)';
      if (conf === 'medium') return 'var(--color-warning)';
      if (conf === 'low') return 'var(--color-error)';
      return '#ccc';
    }

    function showAssessmentDetail(recordId) {
      API.get('/api/parent/children/' + childId + '/assessments/' + recordId)
        .then(function(data) {
          var scorePct = ((data.score || 0) / 4.0 * 100).toFixed(0);
          var bodyHtml = '<div style="max-height:55vh;overflow-y:auto;">';

          bodyHtml += '<div class="text-sm" style="margin-bottom:var(--space-3);">';
          bodyHtml += '<strong>' + data.subjectName + '</strong> &middot; ' + data.topic + '<br>';
          bodyHtml += 'Date: ' + data.date + '<br>';
          bodyHtml += '</div>';

          bodyHtml += '<div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-3);">';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:2rem;font-weight:700;">' + scorePct + '%</div><div class="text-xs text-muted">Score</div></div>';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:1.2rem;font-weight:600;">' + (data.ratingLevel || '-') + '</div><div class="text-xs text-muted">Rating</div></div>';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:1.2rem;font-weight:600;color:' + getConfColor(data.confidence) + ';">' + (data.confidence || '-') + '</div><div class="text-xs text-muted">AI Confidence</div></div>';
          bodyHtml += '</div>';

          if (data.evidence) {
            bodyHtml += '<div class="text-xs" style="margin-bottom:var(--space-2);font-style:italic;padding:var(--space-2);background:var(--color-bg);border-radius:var(--radius-sm);">"' + data.evidence + '"</div>';
          }

          if (data.feedback && data.feedback !== 'No feedback available.') {
            bodyHtml += '<div style="margin-bottom:var(--space-2);"><div class="text-sm" style="font-weight:600;margin-bottom:var(--space-1);">Teacher Feedback</div>';
            bodyHtml += '<div class="text-xs" style="white-space:pre-wrap;padding:var(--space-2);background:var(--color-bg);border-radius:var(--radius-sm);">' + data.feedback + '</div></div>';
          }

          if (data.rubricDesc) {
            bodyHtml += '<div class="text-xs text-muted" style="margin-top:var(--space-2);border-top:1px solid var(--color-border);padding-top:var(--space-2);">';
            bodyHtml += '<strong>Rubric:</strong> ' + data.rubricDesc + '<br>';
            bodyHtml += '<strong>Scale:</strong> ' + (data.ratingScale || '');
            bodyHtml += '</div>';
          }

          bodyHtml += '</div>';

          showModal(data.subjectName + ' — ' + data.studentName,
            bodyHtml,
            '<button class="btn btn-ghost btn-sm modal-close-btn">Close</button>');
        })
        .catch(function() {
          showToast('Failed to load assessment detail.', 'error');
        });
    }

    // load progress data
    API.get('/api/parent/children/' + childId + '/progress')
      .then(function(data) {
        document.getElementById('progress-loading').style.display = 'none';

        if (data.totalAssessments === 0) {
          document.getElementById('progress-empty').style.display = '';
          return;
        }

        document.getElementById('progress-content').classList.remove('hidden');
        document.getElementById('progress-title').textContent = data.studentName || 'Student Progress';

        // stats
        var statsEl = document.getElementById('progress-stats');
        statsEl.innerHTML =
          '<div class="stat-card"><div class="stat-value">' + data.totalAssessments + '</div><div class="stat-label">Assessments</div></div>' +
          '<div class="stat-card"><div class="stat-value">' + (data.overallAveragePct || 0).toFixed(0) + '%</div><div class="stat-label">Overall Average</div></div>' +
          '<div class="stat-card"><div class="stat-value">' + (data.overallAverage || 0).toFixed(1) + '</div><div class="stat-label">Avg Score / 4</div></div>';

        // subject breakdown
        var subjects = data.subjectBreakdown || [];
        var sbEl = document.getElementById('subject-breakdown');
        sbEl.innerHTML = subjects.map(function(s) {
          var pct = (s.averagePct || 0).toFixed(0);
          var barColor = pct >= 75 ? 'var(--color-success)' : pct >= 50 ? 'var(--color-warning)' : 'var(--color-error)';
          return '<div style="margin-bottom:var(--space-2);">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:var(--space-1);">' +
              '<span class="text-sm" style="font-weight:500;">' + s.subject + '</span>' +
              '<span class="text-sm text-muted">' + s.count + ' assessments &middot; ' + pct + '%</span>' +
            '</div>' +
            '<div style="height:8px;background:var(--color-border);border-radius:4px;overflow:hidden;">' +
              '<div style="height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:4px;"></div>' +
            '</div>' +
          '</div>';
        }).join('');

        // recent assessments
        var recent = data.recentAssessments || [];
        var rlEl = document.getElementById('recent-list');
        rlEl.innerHTML = recent.map(function(r) {
          var scorePct = ((r.score || 0) / 4.0 * 100).toFixed(0);
          return '<div class="card assessment-card" data-record-id="' + (r.recordId || '') + '" style="cursor:pointer;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<div>' +
                '<div style="font-weight:600;">' + r.subjectName + '</div>' +
                '<div class="text-sm text-muted">' + r.topic + ' &middot; ' + r.date + '</div>' +
                '<span class="badge" style="font-size:0.7rem;margin-top:var(--space-1);">' + (r.ratingLevel || '-') + '</span>' +
              '</div>' +
              '<div style="text-align:right;">' +
                '<div style="font-size:1.3rem;font-weight:700;">' + scorePct + '%</div>' +
                '<div class="text-xs text-muted">' + (r.score || 0).toFixed(1) + '/4.0</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        // wire clicks on assessment cards
        document.querySelectorAll('.assessment-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var rid = card.getAttribute('data-record-id');
            if (rid) showAssessmentDetail(rid);
          });
        });
      })
      .catch(function(err) {
        document.getElementById('progress-loading').textContent = 'Failed to load: ' + (err.message || 'Unknown error');
      });
  })();
</script>
