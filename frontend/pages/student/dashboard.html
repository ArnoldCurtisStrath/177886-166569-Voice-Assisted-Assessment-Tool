<!-- VoiceAssess — Student Dashboard -->
<div class="animate-fade-in">
  <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-1);" id="student-greeting">Hello</h2>
  <p class="text-xs text-muted" style="margin-bottom: var(--space-5);" id="student-school">Loading...</p>

  <div class="stat-row" style="margin-bottom: var(--space-6);">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">-</div>
      <div class="stat-label">Assessments</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-avg">-</div>
      <div class="stat-label">Average</div>
    </div>
    <div class="stat-card" id="stat-appeal-card" style="cursor:pointer;">
      <div class="stat-value" id="stat-appeals">-</div>
      <div class="stat-label">Appeals</div>
    </div>
  </div>

  <div class="section-header">
    <span class="section-title">My Assessments</span>
  </div>

  <div class="list-stack" id="assessment-list" style="gap: var(--space-3);"></div>

  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="empty-state-icon">~</div>
    <h4>No assessments yet</h4>
    <p>Your teacher will evaluate you soon. Check back later.</p>
  </div>
</div>

<script>
  (function() {
    // load profile for greeting + school
    API.get('/api/student/profile')
      .then(function(p) {
        var firstName = p.fullName ? p.fullName.split(' ')[0] : 'Student';
        document.getElementById('student-greeting').textContent = 'Hello, ' + firstName;
        document.getElementById('student-school').textContent = (p.schoolName || '') + ' &middot; Student Portal';
      })
      .catch(function() {
        document.getElementById('student-school').textContent = 'Student Portal';
      });

    // load assessments
    loadAssessments();

    function loadAssessments() {
      API.get('/api/student/assessments')
        .then(function(data) {
          var items = data.assessments || [];
          var total = data.totalAssessments || 0;
          var avg = data.averageScore || 0;
          var appeals = data.pendingAppeals || 0;

          document.getElementById('stat-total').textContent = total;
          document.getElementById('stat-avg').textContent = avg.toFixed(0) + '%';
          document.getElementById('stat-appeals').textContent = appeals;

          renderList(items);
        })
        .catch(function(err) {
          document.getElementById('stat-total').textContent = '0';
          document.getElementById('stat-avg').textContent = '-';
          document.getElementById('stat-appeals').textContent = '0';
          renderList([]);
        });
    }

    function renderList(items) {
      var listEl = document.getElementById('assessment-list');
      var emptyEl = document.getElementById('empty-state');

      if (!items || items.length === 0) {
        if (listEl) listEl.innerHTML = '';
        if (emptyEl) emptyEl.style.display = '';
        return;
      }
      if (emptyEl) emptyEl.style.display = 'none';

      // sort by date descending
      items.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

      listEl.innerHTML = items.map(function(a) {
        var scorePct = ((a.score || 0) / 4.0 * 100).toFixed(0);
        var confColor = getConfColor(a.confidence);
        var appealBadge = '';
        if (a.appealStatus === 'PENDING') {
          appealBadge = '<span class="badge badge-warning" style="font-size:0.65rem;">Appeal Pending</span>';
        } else if (a.appealStatus === 'UPHELD') {
          appealBadge = '<span class="badge badge-success" style="font-size:0.65rem;">Appeal Upheld</span>';
        } else if (a.appealStatus === 'ADJUSTED') {
          appealBadge = '<span class="badge" style="font-size:0.65rem;background:#E8F8EF;color:var(--color-success);">Adjusted</span>';
        } else if (a.appealStatus === 'DISMISSED') {
          appealBadge = '<span class="badge" style="font-size:0.65rem;background:#FDEDEC;color:var(--color-error);">Dismissed</span>';
        }

        // show resolution note for resolved appeals
        var resolutionNoteHtml = '';
        if (a.appealResolutionNote) {
          resolutionNoteHtml = '<div class="text-xs text-muted" style="margin-top:var(--space-1);font-style:italic;">"' + a.appealResolutionNote + '"</div>';
        }
        var resolvedByHtml = '';
        if (a.appealResolvedBy) {
          resolvedByHtml = '<div class="text-xs text-muted" style="margin-top:var(--space-1);">Resolved by ' + a.appealResolvedBy + ' on ' + (a.appealResolvedAt || '') + '</div>';
        }

        return '<div class="card assessment-item" data-record-id="' + a.recordId + '" data-audio-id="' + a.audioId + '" style="cursor:pointer;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-weight:600;">' + a.subjectName + '</div>' +
              '<div class="text-sm text-muted">' + a.topic + ' &middot; ' + a.date + '</div>' +
              '<div style="margin-top:var(--space-1);">' +
                '<span class="badge" style="font-size:0.7rem;">' + (a.ratingLevel || '-') + '</span>' +
                (a.confidence ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + confColor + ';margin-left:var(--space-2);vertical-align:middle;" title="AI confidence: ' + a.confidence + '"></span>' : '') +
              '</div>' +
            '</div>' +
              '<div style="text-align:right;">' +
              '<div style="font-size:1.4rem;font-weight:700;">' + scorePct + '%</div>' +
              '<div class="text-xs text-muted">' + (a.score || 0).toFixed(1) + '/4.0</div>' +
              appealBadge +
            '</div>' +
          '</div>' +
          resolutionNoteHtml +
          resolvedByHtml +
        '</div>';
      }).join('');

      // wire clicks to show detail modal
      document.querySelectorAll('.assessment-item').forEach(function(card) {
        card.addEventListener('click', function() {
          var rid = card.getAttribute('data-record-id');
          showDetail(rid);
        });
      });
    }

    function showDetail(recordId) {
      API.get('/api/student/assessments/' + recordId)
        .then(function(data) {
          var scorePct = ((data.score || 0) / 4.0 * 100).toFixed(0);
          var bodyHtml = '<div style="max-height:55vh;overflow-y:auto;">';

          bodyHtml += '<div class="text-sm" style="margin-bottom:var(--space-3);">';
          bodyHtml += '<strong>' + data.subjectName + '</strong> &middot; ' + data.topic + '<br>';
          bodyHtml += 'Date: ' + data.date + '<br>';
          bodyHtml += '</div>';

          bodyHtml += '<div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-3);">';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:2rem;font-weight:700;">' + scorePct + '%</div><div class="text-xs text-muted">Score</div></div>';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:1.2rem;font-weight:600;">' + (data.ratingLevel || '-') + '</div><div class="text-xs text-muted">Rating</div></div>';
          bodyHtml += '<div style="flex:1;text-align:center;"><div style="font-size:1.2rem;font-weight:600;color:' + getConfColor(data.confidence) + ';">' + (data.confidence || '-') + '</div><div class="text-xs text-muted">AI Confidence</div></div>';
          bodyHtml += '</div>';

          if (data.evidence) {
            bodyHtml += '<div class="text-xs" style="margin-bottom:var(--space-2);font-style:italic;padding:var(--space-2);background:var(--color-bg);border-radius:var(--radius-sm);">"' + data.evidence + '"</div>';
          }

          // appeal resolution section
          if (data.appealStatus && data.appealStatus !== 'PENDING') {
            var appealColor = data.appealStatus === 'UPHELD' || data.appealStatus === 'ADJUSTED' ? 'var(--color-success)' : 'var(--color-error)';
            bodyHtml += '<div style="margin-bottom:var(--space-2);padding:var(--space-3);border-left:3px solid ' + appealColor + ';background:var(--color-bg);border-radius:var(--radius-sm);">';
            bodyHtml += '<div class="text-sm" style="font-weight:600;margin-bottom:var(--space-1);color:' + appealColor + ';">Appeal ' + data.appealStatus.charAt(0) + data.appealStatus.slice(1).toLowerCase() + '</div>';
            // show the current (possibly adjusted) results
            bodyHtml += '<div class="text-xs" style="margin-bottom:var(--space-1);">Result: ' + (data.ratingLevel || '') + ' &middot; ' + (data.score || 0).toFixed(1) + '/4.0</div>';
            if (data.feedback && data.feedback !== 'No feedback available.') {
              bodyHtml += '<div class="text-xs" style="margin-bottom:var(--space-1);font-style:italic;white-space:pre-wrap;">"' + data.feedback + '"</div>';
            }
            if (data.appealResolutionNote) {
              bodyHtml += '<div class="text-xs" style="white-space:pre-wrap;margin-bottom:var(--space-1);padding:var(--space-1);border-left:2px solid var(--color-primary);">Teacher note: "' + data.appealResolutionNote + '"</div>';
            }
            if (data.appealResolvedBy) {
              bodyHtml += '<div class="text-xs text-muted">Resolved by ' + data.appealResolvedBy + ' on ' + (data.appealResolvedAt || '') + '</div>';
            }
            bodyHtml += '</div>';
          } else if (data.appealStatus === 'PENDING') {
            bodyHtml += '<div style="margin-bottom:var(--space-2);padding:var(--space-2);background:#FFF8E1;border-radius:var(--radius-sm);">';
            bodyHtml += '<span class="badge badge-warning" style="font-size:0.7rem;">Appeal Pending</span>';
            bodyHtml += '<div class="text-xs text-muted" style="margin-top:var(--space-1);">Your teacher has not resolved this appeal yet.</div>';
            bodyHtml += '</div>';
          }

          // teacher feedback (show separately too if not already in appeal box)
          if (data.feedback && data.feedback !== 'No feedback available.' && !(data.appealStatus && data.appealStatus !== 'PENDING')) {
            bodyHtml += '<div style="margin-bottom:var(--space-2);"><div class="text-sm" style="font-weight:600;margin-bottom:var(--space-1);">Teacher Feedback</div>';
            bodyHtml += '<div class="text-xs" style="white-space:pre-wrap;padding:var(--space-2);background:var(--color-bg);border-radius:var(--radius-sm);">' + data.feedback + '</div></div>';
          }

          if (data.rubricDesc) {
            bodyHtml += '<div class="text-xs text-muted" style="margin-top:var(--space-2);border-top:1px solid var(--color-border);padding-top:var(--space-2);">';
            bodyHtml += '<strong>Rubric:</strong> ' + data.rubricDesc + '<br>';
            bodyHtml += '<strong>Scale:</strong> ' + (data.ratingScale || '');
            bodyHtml += '</div>';
          }

          bodyHtml += '</div>';

          showModal(data.subjectName + ' \u00B7 ' + data.topic, bodyHtml,
            '<button class="btn btn-ghost btn-sm modal-close-btn">Close</button>' +
            (data.appealStatus ? '' : '<button class="btn btn-sm" style="background:var(--color-warning);color:white;border:none;" id="appeal-btn" data-audio-id="' + data.audioId + '">Submit Appeal</button>'));

          setTimeout(function() {
            document.querySelectorAll('.modal-close-btn').forEach(function(b) {
              b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
            });
            var ab = document.getElementById('appeal-btn');
            if (ab) ab.addEventListener('click', function() {
              var aid = ab.getAttribute('data-audio-id');
              var o = document.querySelector('.modal-overlay'); if (o) o.remove();
              showAppealForm(aid);
            });
          }, 50);
        })
        .catch(function() { showToast('Failed to load detail.', 'error'); });
    }

    function showAppealForm(audioId) {
      showModal('Submit Appeal',
        '<p class="text-sm" style="margin-bottom:var(--space-3);">Explain why you disagree with this assessment.</p>' +
        '<div class="form-group"><label>Reason</label><textarea class="input" id="appeal-reason" rows="3" placeholder="I believe my score should be higher because..."></textarea></div>',
        '<button class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>' +
        '<button class="btn btn-primary btn-sm" id="submit-appeal-btn">Submit</button>');

      setTimeout(function() {
        document.querySelectorAll('.modal-close-btn').forEach(function(b) {
          b.addEventListener('click', function() { var o = document.querySelector('.modal-overlay'); if (o) o.remove(); });
        });
        var sb = document.getElementById('submit-appeal-btn');
        if (sb) sb.addEventListener('click', function() {
          var reason = document.getElementById('appeal-reason').value.trim();
          if (!reason) { showToast('Please provide a reason.', 'error'); return; }
          API.post('/api/student/appeals', { audioId: audioId, reason: reason })
            .then(function() {
              var o = document.querySelector('.modal-overlay'); if (o) o.remove();
              showToast('Appeal submitted. Your teacher will review it.', 'success');
              loadAssessments();
            })
            .catch(function(err) { showToast('Appeal failed: ' + (err.message || 'Unknown error'), 'error'); });
        });
      }, 50);
    }

    function getConfColor(conf) {
      if (!conf) return '#ccc';
      conf = conf.toLowerCase();
      if (conf === 'high') return 'var(--color-success)';
      if (conf === 'medium') return 'var(--color-warning)';
      if (conf === 'low') return 'var(--color-error)';
      return '#ccc';
    }

    // click appeal stat to navigate
    var appealCard = document.getElementById('stat-appeal-card');
    if (appealCard) {
      appealCard.addEventListener('click', function() {
        Router.navigate('student/appeal');
      });
    }
  })();
</script>
